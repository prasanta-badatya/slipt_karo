<!doctype html>
<!--
  Source for src/assets/og-image.png (1200x630 social share card).
  Re-render after any brand/URL change:

  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --disable-gpu \
    --screenshot=src/assets/og-image.png --window-size=1200,630 --hide-scrollbars \
    --virtual-time-budget=8000 file://$PWD/scripts/og-image.html

  Remember to update the .url line below when the custom domain is live.
-->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:630px; overflow:hidden;
         font-family:Inter, system-ui, -apple-system, sans-serif;
         background:linear-gradient(125deg,#6366f1 0%,#5b5bf0 45%,#4f46e5 100%);
         position:relative; color:#fff; }
  .blob { position:absolute; border-radius:50%; background:rgba(255,255,255,.07); }
  .b1 { width:340px; height:340px; top:-90px; right:-70px; }
  .b2 { width:230px; height:230px; bottom:-110px; left:180px; }
  .wrap { position:relative; padding:78px 92px; height:100%; display:flex; flex-direction:column; }
  .brandrow { display:flex; align-items:center; gap:22px; margin-bottom:56px; }
  .logo { width:92px; height:92px; border-radius:26px; background:#fff;
          display:flex; align-items:center; justify-content:center; }
  .logo svg { width:60px; height:60px; }
  .wordmark { font-size:56px; font-weight:800; letter-spacing:-1.2px; }
  h1 { font-size:70px; font-weight:800; line-height:1.08; letter-spacing:-2px; margin-bottom:26px; }
  h1 .accent { color:#fde68a; }
  .sub { font-size:27px; font-weight:400; line-height:1.45; color:rgba(255,255,255,.88); max-width:930px; }
  .footer { display:flex; align-items:center; gap:17px; margin-top:auto; }
  .pill { border:1.5px solid rgba(255,255,255,.42); border-radius:999px;
          padding:15px 27px; font-size:23px; font-weight:600; white-space:nowrap; }
  .url { margin-left:auto; font-size:21px; font-weight:600;
         color:rgba(255,255,255,.82); white-space:nowrap; }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="wrap">
    <div class="brandrow">
      <div class="logo">
        <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <circle cx="16" cy="16" r="11" fill="#ffffff"/>
          <path d="M17.3 7 L13.4 16 L16.6 16 L14.7 25 L19.8 14.7 L16.6 14.7 Z" fill="#4338ca"/>
        </svg>
      </div>
      <div class="wordmark">WhoPaid</div>
    </div>

    <h1>Split any bill with<br><span class="accent">friends &amp; flatmates</span></h1>
    <p class="sub">Trips, rent, dinners, team outings — equal, exact or day-wise.<br>Free, no sign-up, works offline, settles over UPI.</p>

    <div class="footer">
      <div class="pill">✓ 100% Free</div>
      <div class="pill">✓ Works Offline</div>
      <div class="pill">✓ UPI Settle</div>
      <div class="url">prasanta-badatya.github.io/split_karo</div>
    </div>
  </div>
</body>
</html>
